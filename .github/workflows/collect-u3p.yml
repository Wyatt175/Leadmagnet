name: Collect Utah bids

on:
  schedule:
    - cron: "0 */3 * * *"   # every 3 hours (GitHub uses UTC time)
  workflow_dispatch:         # adds the manual "Run workflow" button

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install -r collector/requirements.txt

      - name: Install the hidden browser
        run: python -m playwright install --with-deps chromium

      - name: Run the Bonfire collector
        run: python collector/collect_bonfire.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PYTHONUNBUFFERED: "1"

      - name: Run the UDOT collector
        if: always()
        run: python collector/collect_udot.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PYTHONUNBUFFERED: "1"

      - name: Run the U3P collector
        if: always()
        run: python collector/collect_u3p.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PYTHONUNBUFFERED: "1"

      - name: Save the debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collector-debug
          path: debug/
          retention-days: 7
